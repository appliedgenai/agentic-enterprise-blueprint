<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Reference deployment</title>
<desc id="desc">A control-plane region pair distributes signed configuration to four serving-cell boundaries. Runtime records cross into an independent assurance boundary.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#536B7A"/></marker>
<marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#B96B00"/></marker>
<marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2F6FB3"/></marker>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:34px;font-weight:700;fill:#17324D}.sub{font-size:18px;fill:#536B7A}.label{font-size:19px;font-weight:700;fill:#17324D}.small{font-size:15px;fill:#536B7A}.tiny{font-size:13px;fill:#536B7A}.path{font-size:16px;font-weight:700;letter-spacing:.7px}.box{stroke-width:2}.arrow{fill:none;stroke:#536B7A;stroke-width:2.8;marker-end:url(#arrow)}.control{fill:none;stroke:#B96B00;stroke-width:2.8;stroke-dasharray:8 7;marker-end:url(#arrowOrange)}.evidence{fill:none;stroke:#2F6FB3;stroke-width:2.8;stroke-dasharray:3 7;marker-end:url(#arrowBlue)}</style>
</defs>
<rect width="1600" height="980" fill="#FFFFFF"/>
<text x="60" y="62" class="h1">Reference deployment</text>
<text x="60" y="96" class="sub">Control-plane change is separate from serving cells; evidence crosses into an independent assurance boundary.</text>

<rect x="470" y="130" width="660" height="180" rx="16" fill="#FFF4E2" stroke="#B96B00" class="box"/>
<text x="505" y="170" class="label">Control-plane region pair</text>
<rect x="515" y="195" width="250" height="78" rx="10" fill="#FFFFFF" stroke="#B96B00" class="box"/>
<text x="640" y="226" text-anchor="middle"><tspan class="label">Authoring services</tspan><tspan x="640" dy="23" class="small">Registries, policy, routes</tspan></text>
<rect x="835" y="195" width="250" height="78" rx="10" fill="#FFFFFF" stroke="#B96B00" class="box"/>
<text x="960" y="226" text-anchor="middle"><tspan class="label">Config distributor</tspan><tspan x="960" dy="23" class="small">Signed versions + leases</tspan></text>
<path d="M765 234 L835 234" class="control"/>

<rect x="185" y="350" width="1230" height="390" rx="18" fill="#F6F9FB" stroke="#2F6FB3" class="box"/>
<text x="220" y="392" class="label">Serving cell — one of N, partitioned by business, geography, tenant or risk tier</text>
<text x="220" y="420" class="small">Every controlled boundary evaluates the locally cached signed version and records the version used.</text>

<rect x="235" y="470" width="240" height="105" rx="14" fill="#E7F7F7" stroke="#098A96" class="box"/>
<text x="355" y="509" text-anchor="middle"><tspan class="label">AI gateway</tspan><tspan x="355" dy="24" class="small">Model route + local policy</tspan></text>
<rect x="525" y="470" width="240" height="105" rx="14" fill="#F0ECFF" stroke="#7253C7" class="box"/>
<text x="645" y="509" text-anchor="middle"><tspan class="label">Agent runtime</tspan><tspan x="645" dy="24" class="small">Isolated durable sessions</tspan></text>
<rect x="815" y="470" width="240" height="105" rx="14" fill="#EAF6EF" stroke="#30835A" class="box"/>
<text x="935" y="500" text-anchor="middle"><tspan class="label">Context / retrieval</tspan><tspan x="935" dy="23" class="small">Permission-aware access</tspan><tspan x="935" dy="21" class="small">to governed data products</tspan></text>
<rect x="1105" y="470" width="240" height="105" rx="14" fill="#FDEEF2" stroke="#C33D61" class="box"/>
<text x="1225" y="509" text-anchor="middle"><tspan class="label">Tool gateway</tspan><tspan x="1225" dy="24" class="small">Action + local policy</tspan></text>

<path d="M960 273 L960 440 M355 440 L1225 440" fill="none" stroke="#B96B00" stroke-width="2.8" stroke-dasharray="8 7"/>
<path d="M355 440 L355 470" class="control"/>
<path d="M645 440 L645 470" class="control"/>
<path d="M935 440 L935 470" class="control"/>
<path d="M1225 440 L1225 470" class="control"/>

<rect x="25" y="465" width="150" height="115" rx="13" fill="#EEF2F5" stroke="#687787" class="box"/>
<text x="100" y="503" text-anchor="middle"><tspan class="label">Approved</tspan><tspan x="100" dy="22" class="label">models</tspan><tspan x="100" dy="25" class="small">Managed or private</tspan></text>
<path d="M175 523 L235 523" class="arrow"/>
<rect x="1425" y="465" width="150" height="115" rx="13" fill="#EEF2F5" stroke="#687787" class="box"/>
<text x="1500" y="503" text-anchor="middle"><tspan class="label">Systems</tspan><tspan x="1500" dy="22" class="label">of record</tspan><tspan x="1500" dy="25" class="small">Core platforms</tspan></text>
<path d="M1345 523 L1425 523" class="arrow"/>

<rect x="620" y="620" width="360" height="82" rx="12" fill="#EAF3FB" stroke="#2F6FB3" class="box"/>
<text x="800" y="651" text-anchor="middle"><tspan class="label">Local record buffer</tspan><tspan x="800" dy="23" class="small">Separate traces, decisions and action outcomes</tspan></text>
<path d="M645 575 C645 602 710 602 735 620" class="evidence"/>
<path d="M1225 575 C1225 600 945 600 875 620" class="evidence"/>

<rect x="110" y="790" width="650" height="125" rx="15" fill="#EEF5FD" stroke="#2F6FB3" class="box"/>
<text x="145" y="832"><tspan class="label">Shared infrastructure substrate</tspan><tspan x="145" dy="25" class="small">Landing zones, networks, compute, recovery and approved private connectivity</tspan></text>
<rect x="885" y="790" width="605" height="125" rx="15" fill="#FFF4E2" stroke="#B96B00" class="box"/>
<text x="920" y="832"><tspan class="label">Assurance boundary</tspan><tspan x="920" dy="25" class="small">Evidence store outside runtime write authority</tspan></text>
<path d="M800 702 C800 755 1110 755 1110 790" class="evidence"/>
<text x="1530" y="954" class="tiny" text-anchor="end">A control-plane outage freezes change; it does not automatically stop approved serving.</text>
</svg>
