<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Reference deployment</title>
<desc id="desc">Control-plane change is separated from serving cells; evidence crosses into an independent assurance boundary.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#536B7A"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#B96B00"/></marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2F6FB3"/></marker>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif} .h1{font-size:34px;font-weight:700;fill:#17324D}.sub{font-size:18px;fill:#536B7A}.label{font-size:19px;font-weight:700;fill:#17324D}.small{font-size:15px;fill:#536B7A}.tiny{font-size:13px;fill:#536B7A}.path{font-size:16px;font-weight:700;letter-spacing:.7px}.box{stroke-width:2}.arrow{fill:none;stroke:#536B7A;stroke-width:2.5;marker-end:url(#arrow)}.control{fill:none;stroke:#B96B00;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow-orange)}.evidence{fill:none;stroke:#2F6FB3;stroke-width:2.5;stroke-dasharray:3 7;marker-end:url(#arrow-blue)}</style>
</defs>
<rect width="1600" height="980" fill="#FFFFFF"/>
<text x="60" y="62" class="h1">Reference deployment</text>
<text x="60" y="96" class="sub">Control-plane change is separated from serving cells; evidence crosses into an independent assurance boundary.</text>
<rect x="75" y="145" width="360" height="160" rx="14" fill="#EEF2F5" stroke="#687787" class="box"/>
<text x="105" y="190" text-anchor="start"><tspan class="label">Approved model endpoints</tspan><tspan x="105" dy="24" class="small">Managed APIs or private inference</tspan></text>
<rect x="1165" y="145" width="360" height="160" rx="14" fill="#EEF2F5" stroke="#687787" class="box"/>
<text x="1195" y="190" text-anchor="start"><tspan class="label">Systems of record</tspan><tspan x="1195" dy="24" class="small">ERP, CRM, core data and legacy platforms</tspan></text>
<rect x="535" y="135" width="530" height="180" rx="14" fill="#FFF4E2" stroke="#B96B00" class="box"/>
<text x="570" y="176" class="label" text-anchor="start">Control-plane region pair</text>
<rect x="575" y="200" width="210" height="78" rx="10" fill="#FFFFFF" stroke="#B96B00" class="box"/>
<text x="680" y="230" text-anchor="middle"><tspan class="label">Authoring services</tspan><tspan x="680" dy="24" class="small">Registries, policy, routes</tspan></text>
<rect x="815" y="200" width="210" height="78" rx="10" fill="#FFFFFF" stroke="#B96B00" class="box"/>
<text x="920" y="230" text-anchor="middle"><tspan class="label">Config distributor</tspan><tspan x="920" dy="24" class="small">Signed, versioned bundles</tspan></text>
<path d="M785 239 L815 239" class="control"/>
<rect x="165" y="365" width="1270" height="340" rx="14" fill="#F6F9FB" stroke="#2F6FB3" class="box"/>
<text x="200" y="410" class="label" text-anchor="start">Serving cell — one of N, partitioned by business, geography, tenant or risk tier</text>
<rect x="220" y="465" width="235" height="100" rx="14" fill="#E7F7F7" stroke="#098A96" class="box"/>
<text x="337.5" y="503" text-anchor="middle"><tspan class="label">AI gateway</tspan><tspan x="337.5" dy="24" class="small">Local routes and policy</tspan></text>
<rect x="500" y="465" width="235" height="100" rx="14" fill="#F0ECFF" stroke="#7253C7" class="box"/>
<text x="617.5" y="503" text-anchor="middle"><tspan class="label">Agent runtime</tspan><tspan x="617.5" dy="24" class="small">Isolated sessions</tspan></text>
<rect x="780" y="465" width="235" height="100" rx="14" fill="#FDEEF2" stroke="#C33D61" class="box"/>
<text x="897.5" y="503" text-anchor="middle"><tspan class="label">Tool gateway</tspan><tspan x="897.5" dy="24" class="small">Local action policy</tspan></text>
<rect x="955" y="600" width="235" height="100" rx="14" fill="#EAF3FB" stroke="#2F6FB3" class="box"/>
<text x="1072.5" y="638" text-anchor="middle"><tspan class="label">Local record buffer</tspan><tspan x="1072.5" dy="24" class="small">Separate trace and action records</tspan></text>
<path d="M500 515 L455 515" class="arrow"/>
<path d="M735 515 L780 515" class="arrow"/>
<rect x="390" y="600" width="515" height="70" rx="10" fill="#EAF6EF" stroke="#30835A" class="box"/>
<text x="648" y="642" class="small" text-anchor="middle">Context, knowledge and governed data products</text>
<path d="M617 565 L617 600" class="arrow"/>
<path d="M617 565 C700 585 850 600 955 635" class="evidence"/>
<path d="M897 565 C910 585 930 600 955 625" class="evidence"/>
<path d="M920 278 C920 340 900 340 900 465" class="control"/>
<path d="M920 278 C920 335 620 335 620 465" class="control"/>
<path d="M920 278 C920 320 337 320 337 465" class="control"/>
<path d="M220 515 C120 515 120 225 435 225" class="arrow"/>
<path d="M1015 515 C1510 515 1510 225 1165 225" class="arrow"/>
<rect x="1020" y="760" width="435" height="140" rx="14" fill="#FFF4E2" stroke="#B96B00" class="box"/>
<text x="1055" y="808" text-anchor="start"><tspan class="label">Assurance boundary</tspan><tspan x="1055" dy="24" class="small">Evidence store outside runtime write authority</tspan></text>
<path d="M1072 700 C1072 730 1237 720 1237 760" class="evidence"/>
<rect x="145" y="760" width="700" height="140" rx="14" fill="#EEF5FD" stroke="#2F6FB3" class="box"/>
<text x="180" y="808" text-anchor="start"><tspan class="label">Shared infrastructure substrate</tspan><tspan x="180" dy="24" class="small">Landing zones, networks, compute, recovery and approved private connectivity</tspan></text>
<text x="1525" y="945" class="tiny" text-anchor="end">A control-plane outage freezes change; it does not automatically stop approved serving</text>
</svg>